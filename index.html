<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake Game</title>
<style>
  :root {
    --bg1: #0f2027;
    --bg2: #203a43;
    --bg3: #2c5364;
    --accent: #39ff88;
    --accent2: #ff5e78;
    --board-bg: #0d1b1f;
    --grid-line: rgba(255,255,255,0.04);
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
  }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Segoe UI', Tahoma, Verdana, sans-serif;
    background: linear-gradient(135deg, var(--bg1), var(--bg2), var(--bg3));
    background-size: 400% 400%;
    animation: gradientShift 15s ease infinite;
    color: #fff;
    padding: 16px;
    overflow: hidden;
  }

  @keyframes gradientShift {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  .container {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    width: 100%;
    max-width: 900px;
    height: 100%;
    justify-content: center;
  }

  h1 {
    margin: 0;
    font-size: clamp(1.8rem, 4vw, 3rem);
    letter-spacing: 4px;
    font-weight: 800;
    background: linear-gradient(90deg, var(--accent), #4fd1ff);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-shadow: 0 0 40px rgba(57,255,136,0.35);
  }

  .hud {
    display: flex;
    justify-content: center;
    gap: 48px;
    width: 100%;
    font-size: clamp(1rem, 1.6vw, 1.3rem);
    padding: 0 4px;
  }

  .hud-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    background: rgba(255,255,255,0.05);
    padding: 8px 22px;
    border-radius: 12px;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.06);
  }

  .hud-item small {
    opacity: 0.55;
    font-size: 0.7em;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .hud span { font-weight: 800; color: var(--accent); font-size: 1.3em; }

  .board-wrap {
    position: relative;
    width: min(88vmin, 800px);
    aspect-ratio: 1 / 1;
    border-radius: 20px;
    padding: 10px;
    background: linear-gradient(145deg, #1c2b30, #0a1214);
    box-shadow:
      0 25px 60px rgba(0,0,0,0.55),
      inset 0 0 0 1px rgba(255,255,255,0.06);
  }

  canvas {
    display: block;
    width: 100%;
    height: 100%;
    border-radius: 14px;
    background: var(--board-bg);
    touch-action: none;
    box-shadow: 0 0 0 1px rgba(57,255,136,0.08);
  }

  .overlay {
    position: absolute;
    inset: 8px;
    border-radius: 10px;
    background: rgba(10, 15, 17, 0.88);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    text-align: center;
    padding: 20px;
    backdrop-filter: blur(2px);
    transition: opacity 0.25s ease;
  }

  .overlay.hidden { display: none; }

  .overlay h2 {
    margin: 0;
    font-size: 1.6rem;
    color: var(--accent2);
  }

  .overlay p { margin: 0; opacity: 0.85; font-size: 0.95rem; }

  button {
    cursor: pointer;
    border: none;
    outline: none;
    padding: 12px 26px;
    font-size: 1rem;
    font-weight: 700;
    border-radius: 999px;
    background: linear-gradient(90deg, var(--accent), #29c8ff);
    color: #062018;
    box-shadow: 0 6px 18px rgba(57,255,136,0.35);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }

  button:hover { transform: translateY(-2px); box-shadow: 0 10px 24px rgba(57,255,136,0.45); }
  button:active { transform: translateY(0); }

  .controls-hint {
    font-size: 0.85rem;
    opacity: 0.6;
    text-align: center;
  }

  /* Mobile D-pad */
  .dpad {
    display: none;
    grid-template-columns: repeat(3, 64px);
    grid-template-rows: repeat(3, 64px);
    gap: 8px;
    margin-top: 4px;
  }

  .dpad button.dbtn {
    background: rgba(255,255,255,0.08);
    color: #fff;
    box-shadow: none;
    font-size: 1.5rem;
    padding: 0;
    border-radius: 14px;
  }

  .dpad button.dbtn:active {
    background: rgba(57,255,136,0.25);
  }

  .dbtn.up { grid-column: 2; grid-row: 1; }
  .dbtn.left { grid-column: 1; grid-row: 2; }
  .dbtn.right { grid-column: 3; grid-row: 2; }
  .dbtn.down { grid-column: 2; grid-row: 3; }

  @media (max-width: 560px) {
    .dpad { display: grid; }
  }
</style>
</head>
<body>

<div class="container">
  <h1>SNAKE</h1>
  <div class="hud">
    <div class="hud-item"><small>Score</small><span id="score">0</span></div>
    <div class="hud-item"><small>Best</small><span id="best">0</span></div>
    <div class="hud-item"><small>Speed</small><span id="speedLvl">1</span></div>
  </div>

  <div class="board-wrap">
    <canvas id="board"></canvas>

    <div class="overlay" id="startOverlay">
      <h2>🐍 Ready?</h2>
      <p>Use arrow keys / WASD or swipe to move.</p>
      <button id="startBtn">Start Game</button>
    </div>

    <div class="overlay hidden" id="pausedOverlay">
      <h2 style="color: var(--accent);">⏸ Paused</h2>
      <p>Press Space to resume</p>
    </div>

    <div class="overlay hidden" id="gameOverOverlay">
      <h2>Game Over</h2>
      <p id="finalScore">Score: 0</p>
      <button id="restartBtn">Play Again</button>
    </div>
  </div>

  <div class="controls-hint">Arrow Keys / WASD to move &nbsp;•&nbsp; Space to pause</div>

  <div class="dpad">
    <button class="dbtn up">↑</button>
    <button class="dbtn left">←</button>
    <button class="dbtn right">→</button>
    <button class="dbtn down">↓</button>
  </div>
</div>

<script>
(function () {
  const canvas = document.getElementById('board');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const speedLvlEl = document.getElementById('speedLvl');
  const startOverlay = document.getElementById('startOverlay');
  const gameOverOverlay = document.getElementById('gameOverOverlay');
  const pausedOverlay = document.getElementById('pausedOverlay');
  const finalScoreEl = document.getElementById('finalScore');
  const startBtn = document.getElementById('startBtn');
  const restartBtn = document.getElementById('restartBtn');

  const GRID_SIZE = 20; // number of cells per row/col
  let cellSize;

  let snake, direction, nextDirection, food, score, best, gameRunning, paused, moveInterval, lastTime, speed;

  best = parseInt(localStorage.getItem('snakeBest') || '0', 10) || 0;
  bestEl.textContent = best;

  function resizeCanvas() {
    const wrap = canvas.parentElement;
    const size = wrap.clientWidth - 16; // padding
    canvas.width = size;
    canvas.height = size;
    cellSize = size / GRID_SIZE;
    draw();
  }
  window.addEventListener('resize', resizeCanvas);

  function resetGame() {
    snake = [
      { x: 8, y: 10 },
      { x: 7, y: 10 },
      { x: 6, y: 10 }
    ];
    direction = { x: 1, y: 0 };
    nextDirection = { x: 1, y: 0 };
    score = 0;
    speed = 130; // ms per move, decreases as score grows
    scoreEl.textContent = score;
    speedLvlEl.textContent = 1;
    placeFood();
    gameRunning = true;
    paused = false;
    lastTime = 0;
  }

  function placeFood() {
    let valid = false;
    while (!valid) {
      food = {
        x: Math.floor(Math.random() * GRID_SIZE),
        y: Math.floor(Math.random() * GRID_SIZE)
      };
      valid = !snake.some(seg => seg.x === food.x && seg.y === food.y);
    }
  }

  function update() {
    direction = nextDirection;
    const head = { x: snake[0].x + direction.x, y: snake[0].y + direction.y };

    // wall collision
    if (head.x < 0 || head.x >= GRID_SIZE || head.y < 0 || head.y >= GRID_SIZE) {
      return endGame();
    }
    // self collision
    if (snake.some(seg => seg.x === head.x && seg.y === head.y)) {
      return endGame();
    }

    snake.unshift(head);

    if (head.x === food.x && head.y === food.y) {
      score += 10;
      scoreEl.textContent = score;
      if (speed > 60) {
        speed -= 3;
        speedLvlEl.textContent = Math.floor((130 - speed) / 10) + 1;
      }
      placeFood();
    } else {
      snake.pop();
    }
  }

  function draw() {
    if (!cellSize) return;
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // grid
    ctx.strokeStyle = 'rgba(255,255,255,0.04)';
    for (let i = 0; i <= GRID_SIZE; i++) {
      ctx.beginPath();
      ctx.moveTo(i * cellSize, 0);
      ctx.lineTo(i * cellSize, canvas.height);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(0, i * cellSize);
      ctx.lineTo(canvas.width, i * cellSize);
      ctx.stroke();
    }

    // food (pulsing glowing dot)
    const fx = food.x * cellSize + cellSize / 2;
    const fy = food.y * cellSize + cellSize / 2;
    const pulse = 0.34 + Math.sin(Date.now() / 200) * 0.06;
    ctx.save();
    ctx.shadowColor = 'rgba(255,94,120,0.8)';
    ctx.shadowBlur = cellSize * 0.6;
    const grad = ctx.createRadialGradient(fx, fy, 1, fx, fy, cellSize);
    grad.addColorStop(0, '#ff8a9a');
    grad.addColorStop(1, '#ff5e78');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(fx, fy, cellSize * pulse, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // snake
    snake.forEach((seg, idx) => {
      const x = seg.x * cellSize;
      const y = seg.y * cellSize;
      const r = idx === 0 ? cellSize * 0.32 : cellSize * 0.26;
      const shade = idx === 0 ? '#39ff88' : `hsl(${150 - idx * 2}, 80%, ${Math.max(35, 55 - idx * 1.5)}%)`;
      ctx.fillStyle = shade;
      roundRect(ctx, x + (cellSize - cellSize * 0.86) / 2, y + (cellSize - cellSize * 0.86) / 2, cellSize * 0.86, cellSize * 0.86, r);
      ctx.fill();

      if (idx === 0) {
        // eyes
        ctx.fillStyle = '#062018';
        const eyeOffsetX = direction.x !== 0 ? cellSize * 0.22 : cellSize * 0.15;
        const eyeOffsetY = direction.y !== 0 ? cellSize * 0.22 : cellSize * 0.15;
        const cx = x + cellSize / 2;
        const cy = y + cellSize / 2;
        ctx.beginPath();
        ctx.arc(cx - eyeOffsetX * (direction.y !== 0 ? 1 : 0.4), cy - eyeOffsetY * (direction.x !== 0 ? 1 : 0.4), cellSize * 0.07, 0, Math.PI * 2);
        ctx.arc(cx + eyeOffsetX * (direction.y !== 0 ? 1 : 0.4), cy + eyeOffsetY * (direction.x !== 0 ? 1 : 0.4), cellSize * 0.07, 0, Math.PI * 2);
        ctx.fill();
      }
    });
  }

  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function loop(timestamp) {
    if (!gameRunning) return;
    if (!paused) {
      if (!lastTime) lastTime = timestamp;
      const elapsed = timestamp - lastTime;
      if (elapsed >= speed) {
        lastTime = timestamp;
        update();
        if (!gameRunning) return; // ended during update
      }
      draw();
    }
    requestAnimationFrame(loop);
  }

  function endGame() {
    gameRunning = false;
    if (score > best) {
      best = score;
      localStorage.setItem('snakeBest', best);
      bestEl.textContent = best;
    }
    finalScoreEl.textContent = 'Score: ' + score;
    gameOverOverlay.classList.remove('hidden');
  }

  function startGame() {
    startOverlay.classList.add('hidden');
    gameOverOverlay.classList.add('hidden');
    pausedOverlay.classList.add('hidden');
    resetGame();
    resizeCanvas();
    requestAnimationFrame(loop);
  }

  function setDirection(dx, dy) {
    // prevent reversing directly into itself
    if (dx === -direction.x && dy === -direction.y) return;
    if (dx === direction.x && dy === direction.y) return;
    nextDirection = { x: dx, y: dy };
  }

  // Keyboard controls
  document.addEventListener('keydown', (e) => {
    switch (e.key) {
      case 'ArrowUp': case 'w': case 'W': setDirection(0, -1); e.preventDefault(); break;
      case 'ArrowDown': case 's': case 'S': setDirection(0, 1); e.preventDefault(); break;
      case 'ArrowLeft': case 'a': case 'A': setDirection(-1, 0); e.preventDefault(); break;
      case 'ArrowRight': case 'd': case 'D': setDirection(1, 0); e.preventDefault(); break;
      case ' ':
        if (gameRunning) {
          paused = !paused;
          pausedOverlay.classList.toggle('hidden', !paused);
        }
        e.preventDefault();
        break;
    }
  });

  // D-pad controls
  document.querySelector('.dbtn.up').addEventListener('click', () => setDirection(0, -1));
  document.querySelector('.dbtn.down').addEventListener('click', () => setDirection(0, 1));
  document.querySelector('.dbtn.left').addEventListener('click', () => setDirection(-1, 0));
  document.querySelector('.dbtn.right').addEventListener('click', () => setDirection(1, 0));

  // Swipe controls
  let touchStartX = 0, touchStartY = 0;
  canvas.addEventListener('touchstart', (e) => {
    const t = e.changedTouches[0];
    touchStartX = t.clientX;
    touchStartY = t.clientY;
  }, { passive: true });

  canvas.addEventListener('touchend', (e) => {
    const t = e.changedTouches[0];
    const dx = t.clientX - touchStartX;
    const dy = t.clientY - touchStartY;
    if (Math.abs(dx) > Math.abs(dy)) {
      if (Math.abs(dx) > 20) setDirection(dx > 0 ? 1 : -1, 0);
    } else {
      if (Math.abs(dy) > 20) setDirection(0, dy > 0 ? 1 : -1);
    }
  }, { passive: true });

  startBtn.addEventListener('click', startGame);
  restartBtn.addEventListener('click', startGame);

  resizeCanvas();
})();
</script>

</body>
</html>
